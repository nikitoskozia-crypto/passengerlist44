<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Учёт пассажиров | Сводка по маршрутам</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #1a1a1a; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 28px; margin-bottom: 8px; color: #1e3a5f; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .back-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #1e3a5f; padding: 5px 10px; border-radius: 40px; transition: 0.2s; }
        .back-btn:hover { background: #e0e7f0; }
        .subtitle { color: #666; margin-bottom: 20px; border-left: 4px solid #1e3a5f; padding-left: 15px; }
        
        .dates-scroll { 
            display: flex; 
            gap: 12px; 
            overflow-x: auto; 
            padding: 10px 0 20px 0; 
            margin-bottom: 10px;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }
        .dates-scroll::-webkit-scrollbar { height: 6px; }
        .dates-scroll::-webkit-scrollbar-track { background: #e0e7f0; border-radius: 10px; }
        .dates-scroll::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 10px; }
        
        .date-chip { 
            background: white; 
            border: 1px solid #ddd; 
            border-radius: 40px; 
            padding: 12px 20px; 
            font-size: 15px; 
            font-weight: 500; 
            cursor: pointer; 
            transition: 0.2s; 
            white-space: nowrap;
            flex-shrink: 0;
        }
        .date-chip:hover { border-color: #1e3a5f; background: #f8f9fa; transform: translateY(-2px); }
        .date-chip.active { background: #1e3a5f; color: white; border-color: #1e3a5f; }
        .date-chip .date-seats { font-size: 11px; opacity: 0.7; margin-left: 6px; }
        
        .time-group {
            background: white;
            border-radius: 20px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .time-header {
            background: #1e3a5f;
            color: white;
            padding: 16px 24px;
            font-weight: 700;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .time-header:hover { background: #2c4a6e; }
        .time-header .time-seats { 
            font-size: 16px; 
            background: rgba(255,255,255,0.2); 
            padding: 6px 16px; 
            border-radius: 40px; 
        }
        .time-content { padding: 0; display: none; }
        
        .summary-block {
            background: #f8f9fa;
            padding: 16px 24px;
            cursor: pointer;
            transition: 0.2s;
            border-bottom: 1px solid #eef2f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .summary-block:hover { background: #eef2f6; }
        .summary-title { font-weight: 700; font-size: 17px; color: #1e3a5f; }
        .summary-seats { font-weight: 700; color: #2c3e50; background: #e0e7f0; padding: 6px 16px; border-radius: 40px; font-size: 15px; }
        
        .route-detail {
            border-bottom: 1px solid #eef2f6;
            padding: 20px 24px;
        }
        .route-detail:last-child { border-bottom: none; }
        .route-title {
            font-weight: 700;
            font-size: 18px;
            color: #1e3a5f;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #1e3a5f;
            display: inline-block;
        }
        .route-total {
            font-size: 16px;
            color: #003cff;
            font-weight: 600;
            margin-left: 15px;
            display: inline-block;
        }
        
        .passengers-table { 
            width: 100%; 
            border-collapse: collapse; 
            background: white; 
            border-radius: 16px; 
            overflow: hidden; 
            margin-top: 10px; 
            table-layout: fixed;
        }
        .passengers-table th, .passengers-table td { 
            padding: 12px 16px; 
            text-align: left; 
            border-bottom: 1px solid #eee; 
            vertical-align: middle;
        }
        .passengers-table th:first-child { width: 60px; }
        .passengers-table th:nth-child(2) { width: auto; }
        .passengers-table th:nth-child(3) { width: 140px; }
        .passengers-table th:nth-child(4) { width: 70px; }
        .passengers-table th:last-child { width: 80px; }
        
        .passengers-table th { background: #f8f9fa; font-weight: 600; color: #555; }
        .empty-state { text-align: center; padding: 50px; background: white; border-radius: 20px; color: #999; }
        .loading { text-align: center; padding: 50px; color: #666; }
        .info-note { background: #e8f4fd; border-radius: 12px; padding: 12px 18px; margin-top: 20px; font-size: 13px; color: #1e3a5f; }
        
        .small-note { font-size: 12px; color: #888; margin-top: 12px; font-weight: 500; }
        
        /* Стиль для чекбокса */
        .check-cell { text-align: center !important; }
        .passenger-check {
            width: 20px;
            height: 20px;
            cursor: pointer;
            transform: scale(1.1);
        }
        .passenger-check:checked {
            accent-color: #1e3a5f;
        }
        
        @media (max-width: 700px) {
            .passengers-table th, .passengers-table td { padding: 10px 12px; font-size: 13px; }
            .passengers-table th:first-child { width: 45px; }
            .passengers-table th:nth-child(3) { width: 110px; }
            .passengers-table th:nth-child(4) { width: 55px; }
            .passengers-table th:last-child { width: 60px; }
            .route-detail { padding: 14px 18px; }
            .time-header { padding: 12px 18px; font-size: 17px; }
            .summary-block { padding: 12px 18px; }
            .route-title { font-size: 16px; }
            .date-chip { padding: 8px 16px; font-size: 13px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 10px;">
        <h1>
            <button class="back-btn" id="backBtn" style="display: none;">←</button>
            <span id="pageTitle">🚐 Учёт пассажиров</span>
        </h1>
    </div>
    <div class="subtitle" id="subtitle">Актуальные рейсы на ближайшие дни</div>

    <div id="mainContent">
        <div class="loading">Загрузка данных...</div>
    </div>
    <div class="info-note" id="infoNote">⚡ Нажмите на время → общая сводка → отдельные таблицы по маршрутам. Поставьте ✔️, если пассажир пришёл.</div>
</div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbw36l-bcrQ4kv4x77xy2x1YaKaWq2JqTCxmuix8O7lswmZ3CDCRGMDcOj4NIJksstM4NA/exec';
    const TIME_ORDER = ['03:30', '10:00', '11:30', '14:00', '15:30', '16:30', '18:00', '21:30'];
    
    let allData = [];
    let currentView = 'dates';
    let selectedDate = null;
    let upcomingDates = [];
    
    // Хранилище для отметок о прибытии (ключ: "дата_маршрут_время_индекс")
    let arrivalChecks = {};

    function parseDate(dateStr) {
        let parts = dateStr.split('.');
        if (parts.length === 3) {
            return new Date(parts[2], parts[1] - 1, parts[0]);
        }
        return new Date(dateStr);
    }

    function isDateUpcoming(dateStr) {
        let today = new Date();
        today.setHours(0, 0, 0, 0);
        let date = parseDate(dateStr);
        date.setHours(0, 0, 0, 0);
        return date >= today;
    }

    function getUpcomingDates(datesArray, limit = 5) {
        let futureDates = datesArray.filter(date => isDateUpcoming(date));
        futureDates.sort((a,b) => parseDate(a) - parseDate(b));
        return futureDates.slice(0, limit);
    }

    function formatDate(dateString) {
        let d = new Date(dateString);
        if (isNaN(d.getTime())) return dateString;
        let day = d.getDate();
        let month = d.getMonth() + 1;
        let year = d.getFullYear();
        return (day < 10 ? '0' + day : day) + '.' + (month < 10 ? '0' + month : month) + '.' + year;
    }

    function formatTime(timeString) {
        let t = new Date(timeString);
        if (isNaN(t.getTime())) return timeString;
        let hours = t.getHours();
        let minutes = t.getMinutes();
        return (hours < 10 ? '0' + hours : hours) + ':' + (minutes < 10 ? '0' + minutes : minutes);
    }

    async function loadData() {
        try {
            const response = await fetch(API_URL);
            let data = await response.json();
            
            allData = data
                .map(item => {
                    let seatsCount = item.seats ? Number(item.seats) : 1;
                    if (isNaN(seatsCount)) seatsCount = 1;
                    if (seatsCount === 0) return null;
                    
                    let passengerName = item.name && item.name.trim() !== '' ? item.name : 'Имя не указано';
                    
                    return {
                        date: formatDate(item.date),
                        route: item.route,
                        time: formatTime(item.time),
                        name: passengerName,
                        phone: item.phone || '—',
                        seats: seatsCount
                    };
                })
                .filter(item => item !== null);
            
            let allDates = [...new Set(allData.map(item => item.date))];
            upcomingDates = getUpcomingDates(allDates, 6);
            
            console.log(`✅ Загружено ${allData.length} записей. Актуальных дат: ${upcomingDates.length}`);
            renderCurrentView();
        } catch (error) {
            console.error('Ошибка загрузки:', error);
            document.getElementById('mainContent').innerHTML = '<div class="empty-state">❌ Ошибка загрузки данных</div>';
        }
    }

    function getTotalSeatsForDate(date) {
        return allData.filter(item => item.date === date).reduce((sum, item) => sum + item.seats, 0);
    }

    function getRoutesByTime(date) {
        const result = [];
        for (let time of TIME_ORDER) {
            const routesAtTime = {};
            const itemsAtTime = allData.filter(item => item.date === date && item.time === time);
            if (itemsAtTime.length === 0) continue;
            
            itemsAtTime.forEach(item => {
                if (!routesAtTime[item.route]) {
                    routesAtTime[item.route] = 0;
                }
                routesAtTime[item.route] += item.seats;
            });
            
            result.push({
                time: time,
                routes: routesAtTime,
                totalSeats: Object.values(routesAtTime).reduce((a,b) => a + b, 0)
            });
        }
        return result;
    }

    function getPassengersByDateTime(date, time, route) {
        return allData.filter(item => 
            item.date === date && item.time === time && item.route === route
        );
    }

    // Сохранение отметки
    function saveCheck(key, isChecked) {
        if (isChecked) {
            arrivalChecks[key] = true;
        } else {
            delete arrivalChecks[key];
        }
        localStorage.setItem('arrivalChecks', JSON.stringify(arrivalChecks));
    }
    
    // Загрузка отметок
    function loadChecks() {
        const saved = localStorage.getItem('arrivalChecks');
        if (saved) {
            arrivalChecks = JSON.parse(saved);
        }
    }

    function renderCurrentView() {
        if (currentView === 'dates') renderDatesView();
        else if (currentView === 'times') renderTimesView();
        
        const backBtn = document.getElementById('backBtn');
        const pageTitle = document.getElementById('pageTitle');
        const subtitle = document.getElementById('subtitle');
        
        if (currentView === 'dates') {
            backBtn.style.display = 'none';
            pageTitle.innerHTML = '🚐 Учёт пассажиров';
            subtitle.innerHTML = 'Актуальные рейсы на ближайшие дни';
        } else if (currentView === 'times') {
            backBtn.style.display = 'inline-block';
            pageTitle.innerHTML = `📅 ${selectedDate}`;
            subtitle.innerHTML = 'Нажмите на время, чтобы увидеть сводку, затем на сводку — для таблиц пассажиров';
        }
    }

    function renderDatesView() {
        const container = document.getElementById('mainContent');
        
        if (upcomingDates.length === 0) {
            container.innerHTML = '<div class="empty-state">✨ Нет предстоящих рейсов</div>';
            return;
        }
        
        container.innerHTML = `
            <div class="dates-scroll" id="datesScroll">
                ${upcomingDates.map(date => `
                    <div class="date-chip" data-date="${date}">
                        ${date}
                        <span class="date-seats">${getTotalSeatsForDate(date)} мест</span>
                    </div>
                `).join('')}
            </div>
            <div id="timesContainer"></div>
        `;
        
        document.querySelectorAll('.date-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                selectedDate = chip.dataset.date;
                document.querySelectorAll('.date-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                renderTimesView();
                currentView = 'times';
                renderCurrentView();
            });
        });
        
        if (selectedDate && upcomingDates.includes(selectedDate)) {
            const chip = document.querySelector(`.date-chip[data-date="${selectedDate}"]`);
            if (chip) chip.click();
        } else if (upcomingDates.length > 0) {
            document.querySelector('.date-chip').click();
        }
    }

    function renderTimesView() {
        const routesByTime = getRoutesByTime(selectedDate);
        const container = document.getElementById('timesContainer') || document.getElementById('mainContent');
        
        if (routesByTime.length === 0) {
            container.innerHTML = '<div class="empty-state">✨ Нет рейсов на эту дату</div>';
            return;
        }
        
        container.innerHTML = routesByTime.map(timeBlock => `
            <div class="time-group">
                <div class="time-header" data-time="${timeBlock.time}">
                    <span>🕐 ${timeBlock.time}</span>
                    <span class="time-seats">${timeBlock.totalSeats} мест</span>
                </div>
                <div class="time-content" id="time-content-${timeBlock.time.replace(':', '')}" style="display: none;">
                    <div class="summary-block" data-time="${timeBlock.time}">
                        <span class="summary-title">📋 Общая сводка</span>
                        <span class="summary-seats">${timeBlock.totalSeats} мест</span>
                    </div>
                    <div class="routes-details" id="routes-details-${timeBlock.time.replace(':', '')}" style="display: none;">
                        ${Object.keys(timeBlock.routes).map(route => {
                            const passengers = getPassengersByDateTime(selectedDate, timeBlock.time, route);
                            const totalSeats = passengers.reduce((sum, p) => sum + p.seats, 0);
                            const displayRoute = route.replace('-', ' → ');
                            return `
                                <div class="route-detail">
                                    <div>
                                        <span class="route-title">${displayRoute}</span>
                                        <span class="route-total">Количество людей: ${totalSeats}</span>
                                    </div>
                                    ${passengers.length === 0 ? '<div class="empty-state" style="padding: 20px;">Нет пассажиров</div>' : `
                                        <table class="passengers-table">
                                            <thead>
                                                <tr>
                                                    <th>№</th>
                                                    <th>ФИО пассажира</th>
                                                    <th>Телефон</th>
                                                    <th>Мест</th>
                                                    <th>✔️</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                ${passengers.map((p, idx) => {
                                                    const checkKey = `${selectedDate}_${route}_${timeBlock.time}_${idx}`;
                                                    const isChecked = arrivalChecks[checkKey] || false;
                                                    return `
                                                        <tr>
                                                            <td>${idx+1}</td>
                                                            <td><strong>${p.name}</strong></td>
                                                            <td>${p.phone}</td>
                                                            <td>${p.seats}</td>
                                                            <td class="check-cell">
                                                                <input type="checkbox" class="passenger-check" data-key="${checkKey}" ${isChecked ? 'checked' : ''}>
                                                            </td>
                                                        </tr>
                                                    `;
                                                }).join('')}
                                            </tbody>
                                        </table>
                                    `}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            </div>
        `).join('');
        
        document.querySelectorAll('.time-header').forEach(header => {
            const time = header.dataset.time;
            const content = document.getElementById(`time-content-${time.replace(':', '')}`);
            header.addEventListener('click', (e) => {
                e.stopPropagation();
                content.style.display = content.style.display === 'none' ? 'block' : 'none';
            });
        });
        
        document.querySelectorAll('.summary-block').forEach(summary => {
            const time = summary.dataset.time;
            const detailsDiv = document.getElementById(`routes-details-${time.replace(':', '')}`);
            summary.addEventListener('click', (e) => {
                e.stopPropagation();
                if (detailsDiv.style.display === 'none') {
                    detailsDiv.style.display = 'block';
                    summary.style.background = '#eef2f6';
                } else {
                    detailsDiv.style.display = 'none';
                    summary.style.background = '#f8f9fa';
                }
            });
        });
        
        // Обработчики для чекбоксов
        document.querySelectorAll('.passenger-check').forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {
                const key = checkbox.dataset.key;
                saveCheck(key, checkbox.checked);
            });
        });
    }

    document.getElementById('backBtn').addEventListener('click', () => {
        if (currentView === 'times') {
            currentView = 'dates';
            selectedDate = null;
            renderCurrentView();
        }
    });
    
    // Загружаем сохранённые отметки
    loadChecks();
    loadData();
</script>
</body>
</html>
